worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 10m;

  # gzip
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             application/xml image/svg+xml application/wasm;

  # ---------- upstreams ----------
  # nginx резолвит имена сервисов Docker-сети при старте; для reload'а при
  # масштабировании (--scale api=N) используем resolver + переменную в proxy_pass.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream marketplace_web {
    server web:3000;
    keepalive 32;
  }

  upstream marketplace_api {
    server api:4000;
    keepalive 32;
  }

  # ---------- security headers ----------
  include /etc/nginx/snippets/security-headers.conf;

  # ---------- rate limit (общий на IP) ----------
  limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=api_strict:10m rate=10r/s;
  limit_req_status 429;

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name example.com api.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Healthcheck для nginx-контейнера
    location = /healthz {
      access_log off;
      return 200 'ok\n';
      add_header Content-Type text/plain;
    }

    # ---------- Web (Next.js) ----------
    location / {
      limit_req zone=general burst=50 nodelay;
      proxy_pass http://marketplace_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_cache_bypass $http_upgrade;
    }

    # ---------- API ----------
    location /api/ {
      limit_req zone=api_strict burst=20 nodelay;
      proxy_pass http://marketplace_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Media (MinIO) — читается через CDN в проде ----------
    location /media/ {
      proxy_pass http://minio:9000;
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
    }
  }
}
